apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-notificaciones
  namespace: drgueria
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-notificaciones
  template:
    metadata:
      labels:
        app: ms-notificaciones
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: ms-notificaciones
        image: drgueria/ms-notificaciones:latest
        ports:
        - containerPort: 3005
        envFrom:
        - configMapRef:
            name: ms-notificaciones-config
        livenessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"