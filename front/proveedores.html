<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DRGUERIA · Proveedores</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --verde-oscuro:  #0a5c45;
      --verde-medio:   #1a8a68;
      --verde-claro:   #2cbf8e;
      --verde-suave:   #d6f5ec;
      --verde-bg:      #f2faf7;
      --gris-texto:    #3d4a44;
      --gris-borde:    #c4ddd5;
      --rojo:          #e05252;
      --amarillo:      #f59e0b;
      --sidebar-w:     240px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--verde-bg); color: var(--gris-texto); display: flex; min-height: 100vh; }

    /* ══ Sidebar ══ */
    .sidebar { width: var(--sidebar-w); background: var(--verde-oscuro); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; z-index: 200; overflow-y: auto; }
    .sidebar-logo { padding: 1.6rem 1.4rem 1.2rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .sidebar-logo a { font-family: 'DM Serif Display', serif; font-size: 1.6rem; color: #fff; text-decoration: none; }
    .sidebar-logo a span { color: #a8e8d0; }
    .sidebar-logo .rol-badge { display: inline-block; background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; border-radius: 4px; padding: 0.15rem 0.5rem; margin-top: 0.3rem; }
    .sidebar-nav { flex: 1; padding: 1rem 0; }
    .nav-section-title { font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.35); padding: 0.8rem 1.4rem 0.3rem; }
    .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.65rem 1.4rem; color: rgba(255,255,255,0.72); text-decoration: none; font-size: 0.9rem; transition: all 0.18s; border-left: 3px solid transparent; }
    .sidebar-link i { font-size: 1rem; width: 18px; }
    .sidebar-link:hover { background: rgba(255,255,255,0.07); color: #fff; }
    .sidebar-link.activo { background: rgba(255,255,255,0.1); color: #fff; border-left-color: var(--verde-claro); }
    .sidebar-footer { padding: 1rem 1.4rem; border-top: 1px solid rgba(255,255,255,0.1); }
    .sidebar-usuario { font-size: 0.82rem; color: rgba(255,255,255,0.6); margin-bottom: 0.6rem; }
    .sidebar-usuario strong { color: #fff; display: block; }
    .btn-logout-sidebar { width: 100%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18); color: rgba(255,255,255,0.8); border-radius: 8px; padding: 0.45rem; font-size: 0.82rem; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.18s; }
    .btn-logout-sidebar:hover { background: rgba(255,255,255,0.18); }

    /* ══ Main ══ */
    .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; }
    .topbar { background: #fff; border-bottom: 1px solid var(--gris-borde); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    .topbar h1 { font-family: 'DM Serif Display', serif; font-size: 1.5rem; color: var(--verde-oscuro); margin: 0; }
    .topbar .sub { font-size: 0.82rem; color: #9db8ad; }
    .btn-nuevo { background: linear-gradient(135deg, var(--verde-oscuro), var(--verde-medio)); border: none; border-radius: 9px; color: #fff; padding: 0.55rem 1.2rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; display: flex; align-items: center; gap: 0.4rem; box-shadow: 0 4px 14px rgba(10,92,69,0.22); transition: transform 0.15s, opacity 0.18s; }
    .btn-nuevo:hover { transform: translateY(-1px); opacity: 0.92; }

    .pagina { padding: 1.8rem 2rem; }

    /* ══ Toolbar ══ */
    .toolbar { background: #fff; border-radius: 12px; border: 1.5px solid var(--gris-borde); padding: 1rem 1.2rem; margin-bottom: 1.2rem; display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
    .busqueda-wrap { flex: 1; min-width: 200px; position: relative; }
    .busqueda-wrap i { position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: #9db8ad; }
    .busqueda-wrap input { width: 100%; border: 1.5px solid var(--gris-borde); border-radius: 9px; padding: 0.5rem 1rem 0.5rem 2.4rem; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
    .busqueda-wrap input:focus { border-color: var(--verde-medio); }
    .select-filtro { border: 1.5px solid var(--gris-borde); border-radius: 9px; padding: 0.5rem 0.9rem; font-family: 'DM Sans', sans-serif; font-size: 0.88rem; color: var(--gris-texto); outline: none; background: #fff; cursor: pointer; }
    .select-filtro:focus { border-color: var(--verde-medio); }

    /* ══ Cards grid ══ */
    .grid-proveedores { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; }

    .card-proveedor {
      background: #fff;
      border-radius: 14px;
      border: 1.5px solid var(--gris-borde);
      overflow: hidden;
      display: flex; flex-direction: column;
      transition: transform 0.18s, box-shadow 0.18s;
      animation: fadeUp 0.3s ease both;
    }
    .card-proveedor:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(10,92,69,0.1); }

    .card-header-prv {
      background: linear-gradient(135deg, var(--verde-oscuro), var(--verde-medio));
      padding: 1.2rem 1.3rem 1rem;
      display: flex; align-items: flex-start; gap: 0.9rem;
    }
    .card-icono-prv {
      width: 46px; height: 46px;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }
    .card-header-info { flex: 1; }
    .card-id-prv { font-size: 0.7rem; color: rgba(255,255,255,0.55); letter-spacing: 0.1em; text-transform: uppercase; }
    .card-nombre-prv { font-weight: 600; color: #fff; font-size: 1rem; line-height: 1.25; margin-top: 0.15rem; }

    .card-body-prv { padding: 1rem 1.3rem; flex: 1; }
    .dato-fila { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem; font-size: 0.88rem; }
    .dato-fila i { color: var(--verde-medio); font-size: 0.95rem; width: 16px; flex-shrink: 0; }
    .dato-fila span { color: var(--gris-texto); }
    .chip-cat-prv { display: inline-flex; align-items: center; gap: 0.3rem; background: var(--verde-suave); color: var(--verde-oscuro); border-radius: 20px; padding: 0.2rem 0.7rem; font-size: 0.75rem; font-weight: 600; }

    .card-footer-prv { padding: 0.8rem 1.3rem; border-top: 1px solid var(--gris-borde); display: flex; gap: 0.5rem; }
    .btn-accion { border: none; border-radius: 7px; padding: 0.38rem 0.8rem; font-size: 0.8rem; cursor: pointer; transition: opacity 0.18s; display: flex; align-items: center; gap: 0.3rem; font-family: 'DM Sans', sans-serif; font-weight: 500; }
    .btn-accion:hover { opacity: 0.8; }
    .btn-editar   { background: #dbeafe; color: #1e40af; }
    .btn-eliminar { background: #ffe4e4; color: var(--rojo); margin-left: auto; }

    /* Vacío */
    .estado-vacio { text-align: center; padding: 3rem 2rem; color: #9db8ad; grid-column: 1/-1; }
    .estado-vacio i { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; }

    /* Footer count */
    .count-bar { font-size: 0.82rem; color: #9db8ad; margin-bottom: 0.8rem; }

    /* ══ Skeleton ══ */
    .sk-card { background: #fff; border-radius: 14px; border: 1.5px solid var(--gris-borde); overflow: hidden; }
    .sk-header { height: 80px; background: linear-gradient(90deg,#c8e8d8 25%,#b8e0cc 50%,#c8e8d8 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite; }
    .sk-body { padding: 1rem 1.3rem; }
    .sk { height: 13px; border-radius: 6px; background: linear-gradient(90deg,#e8f5f1 25%,#d6f5ec 50%,#e8f5f1 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite; margin-bottom: 0.7rem; }

    /* ══ Modales ══ */
    .modal-header-verde { background: var(--verde-oscuro); color: #fff; border-radius: 12px 12px 0 0; }
    .modal-header-verde .modal-title { font-family: 'DM Serif Display', serif; font-size: 1.2rem; }
    .modal-header-verde .btn-close { filter: invert(1); }
    .form-label-custom { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gris-texto); margin-bottom: 0.35rem; display: block; }
    .input-custom { width: 100%; border: 1.5px solid var(--gris-borde); border-radius: 9px; padding: 0.6rem 0.9rem; font-family: 'DM Sans', sans-serif; font-size: 0.92rem; color: var(--gris-texto); outline: none; transition: border-color 0.2s; }
    .input-custom:focus { border-color: var(--verde-medio); box-shadow: 0 0 0 3px rgba(26,138,104,0.1); }
    .select-custom { width: 100%; border: 1.5px solid var(--gris-borde); border-radius: 9px; padding: 0.6rem 0.9rem; font-family: 'DM Sans', sans-serif; font-size: 0.92rem; color: var(--gris-texto); outline: none; background: #fff; transition: border-color 0.2s; cursor: pointer; }
    .select-custom:focus { border-color: var(--verde-medio); }
    .btn-guardar-modal { background: linear-gradient(135deg, var(--verde-oscuro), var(--verde-medio)); border: none; border-radius: 9px; color: #fff; padding: 0.65rem 1.8rem; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: opacity 0.18s; }
    .btn-guardar-modal:hover { opacity: 0.9; }
    .btn-guardar-modal:disabled { opacity: 0.6; cursor: not-allowed; }

    .modal-eliminar .modal-header { background: var(--rojo); border-radius: 12px 12px 0 0; }
    .modal-eliminar .modal-title  { font-family: 'DM Serif Display', serif; font-size: 1.2rem; color: #fff; }
    .modal-eliminar .btn-close    { filter: invert(1); }
    .btn-confirmar-eliminar { background: var(--rojo); border: none; border-radius: 9px; color: #fff; padding: 0.6rem 1.6rem; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: opacity 0.18s; }
    .btn-confirmar-eliminar:hover { opacity: 0.88; }

    /* ══ Toast ══ */
    .toast-drg { position: fixed; bottom: 2rem; right: 2rem; z-index: 9999; background: #fff; border-radius: 12px; box-shadow: 0 8px 32px rgba(10,92,69,0.18); border-left: 4px solid var(--verde-claro); padding: 1rem 1.3rem; min-width: 260px; display: none; animation: slideIn 0.3s ease; }
    .toast-drg.error { border-left-color: var(--rojo); }
    .toast-titulo { font-weight: 600; font-size: 0.9rem; }
    .toast-msg    { font-size: 0.82rem; color: #7a9c8e; margin-top: 0.15rem; }

    @keyframes shimmer { to { background-position: -200% 0; } }
    @keyframes slideIn { from { opacity:0; transform:translateX(30px); } to { opacity:1; transform:translateX(0); } }
    @keyframes fadeUp  { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .main { margin-left: 0; }
      .pagina { padding: 1rem; }
    }
  </style>
</head>
<body>

  <!-- ══ Sidebar ══ -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <a href="dashboard.html">DR<span>GUERIA</span></a>
      <div class="rol-badge">Administrador</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-title">Principal</div>
      <a class="sidebar-link" href="dashboard.html"><i class="bi bi-speedometer2"></i>Dashboard</a>
      <div class="nav-section-title">Inventario</div>
      <a class="sidebar-link" href="productos.html"><i class="bi bi-box-seam"></i>Productos</a>
      <a class="sidebar-link" href="pedidos.html"><i class="bi bi-truck"></i>Pedidos</a>
      <div class="nav-section-title">Gestión</div>
      <a class="sidebar-link activo" href="proveedores.html"><i class="bi bi-building"></i>Proveedores</a>
      <a class="sidebar-link" href="usuarios.html"><i class="bi bi-people"></i>Usuarios</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-usuario">Sesión iniciada como<strong id="sidebarNombre">…</strong></div>
      <button class="btn-logout-sidebar" onclick="cerrarSesion()"><i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión</button>
    </div>
  </aside>

  <!-- ══ Main ══ -->
  <div class="main">
    <div class="topbar">
      <div>
        <h1>Proveedores</h1>
        <div class="sub">Gestión de proveedores por categoría</div>
      </div>
      <button class="btn-nuevo" onclick="abrirModalNuevo()">
        <i class="bi bi-plus-lg"></i> Nuevo proveedor
      </button>
    </div>

    <div class="pagina">

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="busqueda-wrap">
          <i class="bi bi-search"></i>
          <input type="text" id="inputBusqueda" placeholder="Buscar por nombre o contacto…"/>
        </div>
        <select class="select-filtro" id="filtroCat">
          <option value="">Todas las categorías</option>
          <option>Analgésico</option>
          <option>Antibiótico</option>
          <option>Vitaminas y suplementos</option>
          <option>Cuidado personal</option>
          <option>Condones</option>
          <option>Lubricantes</option>
        </select>
      </div>

      <div class="count-bar" id="countBar">Cargando…</div>

      <!-- Grid de cards -->
      <div class="grid-proveedores" id="gridProveedores">
        <!-- Skeletons -->
        <div class="sk-card"><div class="sk-header"></div><div class="sk-body"><div class="sk w-75"></div><div class="sk w-50"></div><div class="sk w-60"></div></div></div>
        <div class="sk-card"><div class="sk-header"></div><div class="sk-body"><div class="sk w-75"></div><div class="sk w-50"></div><div class="sk w-60"></div></div></div>
        <div class="sk-card"><div class="sk-header"></div><div class="sk-body"><div class="sk w-75"></div><div class="sk w-50"></div><div class="sk w-60"></div></div></div>
      </div>
    </div>
  </div>

  <!-- ══ Modal: Crear / Editar ══ -->
  <div class="modal fade" id="modalProveedor" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow" style="border-radius:14px;overflow:hidden;">
        <div class="modal-header modal-header-verde">
          <h5 class="modal-title" id="modalTitulo"><i class="bi bi-building me-2"></i>Nuevo proveedor</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <div id="alertaModal" class="alert d-none small mb-3" style="border-radius:9px;"></div>
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label-custom">Nombre de la empresa</label>
              <input type="text" class="input-custom" id="fNombre" placeholder="Ej: Distribuidora Analgésicos del Valle"/>
            </div>
            <div class="col-md-6">
              <label class="form-label-custom">Contacto (persona)</label>
              <input type="text" class="input-custom" id="fContacto" placeholder="Ej: Carlos Gómez"/>
            </div>
            <div class="col-md-6">
              <label class="form-label-custom">Teléfono</label>
              <input type="text" class="input-custom" id="fTelefono" placeholder="Ej: 3001234567"/>
            </div>
            <div class="col-12">
              <label class="form-label-custom">Categoría que suministra</label>
              <select class="select-custom" id="fCategoria">
                <option value="">Seleccionar…</option>
                <option>Analgésico</option>
                <option>Antibiótico</option>
                <option>Vitaminas y suplementos</option>
                <option>Cuidado personal</option>
                <option>Condones</option>
                <option>Lubricantes</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer border-0 pt-0 px-4 pb-4">
          <button type="button" class="btn btn-sm text-muted" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn-guardar-modal" id="btnGuardar" onclick="guardarProveedor()">
            <span id="spinnerGuardar" class="spinner-border spinner-border-sm me-1 d-none"></span>
            Guardar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ Modal: Eliminar ══ -->
  <div class="modal fade modal-eliminar" id="modalEliminar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content border-0 shadow" style="border-radius:14px;overflow:hidden;">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-trash me-2"></i>Eliminar proveedor</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4 text-center">
          <i class="bi bi-exclamation-triangle-fill" style="font-size:2.5rem;color:var(--rojo)"></i>
          <p class="mt-2 mb-0">¿Eliminar a <strong id="eliminarNombre"></strong>? Esta acción no se puede deshacer.</p>
        </div>
        <div class="modal-footer border-0 justify-content-center pb-4">
          <button type="button" class="btn btn-sm text-muted" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn-confirmar-eliminar" id="btnConfirmarEliminar" onclick="confirmarEliminar()">
            <span id="spinnerEliminar" class="spinner-border spinner-border-sm me-1 d-none"></span>
            Sí, eliminar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-drg" id="toast">
    <div class="toast-titulo" id="toastTitulo"></div>
    <div class="toast-msg"    id="toastMsg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API = 'http://192.168.100.2:4000';

    /* ── Auth ── */
    const token   = localStorage.getItem('token');
    const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
    const rol     = localStorage.getItem('rol');
    if (!token)                  window.location.href = 'index.html';
    if (rol !== 'administrador') window.location.href = 'catalogo.html';
    document.getElementById('sidebarNombre').textContent = usuario.nombre || 'Admin';

    /* ── Estado ── */
    let proveedores  = [];
    let modoEdicion  = false;
    let idEditando   = null;
    let idEliminar   = null;

    const modalProvBS   = new bootstrap.Modal(document.getElementById('modalProveedor'));
    const modalElimBS   = new bootstrap.Modal(document.getElementById('modalEliminar'));

    /* Iconos por categoría */
    const iconos = {
      'Analgésico':'💊','Antibiótico':'🧬','Vitaminas y suplementos':'🍊',
      'Cuidado personal':'🧴','Condones':'🛡️','Lubricantes':'💧'
    };

    /* ── Cargar ── */
    async function cargarProveedores() {
      try {
        const res  = await fetch(`${API}/proveedores`);
        proveedores = await res.json();
        if (!Array.isArray(proveedores)) proveedores = proveedores.proveedores || [];
        renderGrid();
      } catch {
        mostrarToast('Error', 'No se pudo cargar la lista de proveedores.', true);
      }
    }

    /* ── Render ── */
    function renderGrid() {
      const q    = document.getElementById('inputBusqueda').value.toLowerCase().trim();
      const cat  = document.getElementById('filtroCat').value;
      const grid = document.getElementById('gridProveedores');
      const count= document.getElementById('countBar');

      let lista = proveedores;
      if (q)   lista = lista.filter(p => p.nombre.toLowerCase().includes(q) || (p.contacto || '').toLowerCase().includes(q));
      if (cat) lista = lista.filter(p => p.categoria === cat);

      count.textContent = `${lista.length} proveedor${lista.length !== 1 ? 'es' : ''}`;

      if (lista.length === 0) {
        grid.innerHTML = `<div class="estado-vacio"><i class="bi bi-building"></i><p class="mb-0">No hay proveedores que coincidan</p></div>`;
        return;
      }

      grid.innerHTML = lista.map((p, i) => `
        <div class="card-proveedor" style="animation-delay:${i*0.05}s">
          <div class="card-header-prv">
            <div class="card-icono-prv">${iconos[p.categoria] || '🏢'}</div>
            <div class="card-header-info">
              <div class="card-id-prv">Proveedor #${p.id_proveedor}</div>
              <div class="card-nombre-prv">${p.nombre}</div>
            </div>
          </div>
          <div class="card-body-prv">
            <div class="dato-fila">
              <i class="bi bi-person"></i>
              <span>${p.contacto || '—'}</span>
            </div>
            <div class="dato-fila">
              <i class="bi bi-telephone"></i>
              <span>${p.telefono || '—'}</span>
            </div>
            <div class="dato-fila">
              <i class="bi bi-tag"></i>
              <span class="chip-cat-prv">${iconos[p.categoria] || ''} ${p.categoria}</span>
            </div>
          </div>
          <div class="card-footer-prv">
            <button class="btn-accion btn-editar" onclick="abrirModalEditar(${p.id_proveedor})">
              <i class="bi bi-pencil"></i> Editar
            </button>
            <button class="btn-accion btn-eliminar" onclick="abrirModalEliminar(${p.id_proveedor})">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>`).join('');
    }

    /* Filtros */
    document.getElementById('inputBusqueda').addEventListener('input', renderGrid);
    document.getElementById('filtroCat').addEventListener('change', renderGrid);

    /* ══ MODAL NUEVO ══ */
    function abrirModalNuevo() {
      modoEdicion = false; idEditando = null;
      document.getElementById('modalTitulo').innerHTML = '<i class="bi bi-building me-2"></i>Nuevo proveedor';
      limpiarForm();
      modalProvBS.show();
    }

    /* ══ MODAL EDITAR ══ */
    function abrirModalEditar(id) {
      const p = proveedores.find(x => x.id_proveedor === id);
      if (!p) return;
      modoEdicion = true; idEditando = id;
      document.getElementById('modalTitulo').innerHTML = '<i class="bi bi-pencil me-2"></i>Editar proveedor';
      document.getElementById('fNombre').value    = p.nombre;
      document.getElementById('fContacto').value  = p.contacto  || '';
      document.getElementById('fTelefono').value  = p.telefono  || '';
      document.getElementById('fCategoria').value = p.categoria || '';
      document.getElementById('alertaModal').className = 'alert d-none small mb-3';
      modalProvBS.show();
    }

    function limpiarForm() {
      ['fNombre','fContacto','fTelefono','fCategoria'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('alertaModal').className = 'alert d-none small mb-3';
    }

    /* ══ GUARDAR ══ */
    async function guardarProveedor() {
      const nombre    = document.getElementById('fNombre').value.trim();
      const contacto  = document.getElementById('fContacto').value.trim();
      const telefono  = document.getElementById('fTelefono').value.trim();
      const categoria = document.getElementById('fCategoria').value;
      const alerta    = document.getElementById('alertaModal');
      const btn       = document.getElementById('btnGuardar');
      const spinner   = document.getElementById('spinnerGuardar');

      if (!nombre || !categoria) {
        alerta.className = 'alert alert-warning small mb-3';
        alerta.textContent = 'El nombre y la categoría son obligatorios.';
        return;
      }

      btn.disabled = true; spinner.classList.remove('d-none');
      const body   = { nombre, contacto, telefono, categoria };
      const url    = modoEdicion ? `${API}/proveedores/${idEditando}` : `${API}/proveedores`;
      const method = modoEdicion ? 'PUT' : 'POST';

      try {
        const res  = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.mensaje || data.error || 'Error al guardar.');
        modalProvBS.hide();
        mostrarToast(modoEdicion ? 'Proveedor actualizado' : 'Proveedor creado', nombre);
        await cargarProveedores();
      } catch (e) {
        alerta.className = 'alert alert-danger small mb-3';
        alerta.textContent = e.message;
      } finally {
        btn.disabled = false; spinner.classList.add('d-none');
      }
    }

    /* ══ ELIMINAR ══ */
    function abrirModalEliminar(id) {
      const p = proveedores.find(x => x.id_proveedor === id);
      if (!p) return;
      idEliminar = id;
      document.getElementById('eliminarNombre').textContent = p.nombre;
      modalElimBS.show();
    }

    async function confirmarEliminar() {
      const btn     = document.getElementById('btnConfirmarEliminar');
      const spinner = document.getElementById('spinnerEliminar');
      btn.disabled = true; spinner.classList.remove('d-none');
      try {
        const res = await fetch(`${API}/proveedores/${idEliminar}`, { method: 'DELETE' });
        if (!res.ok) throw new Error();
        modalElimBS.hide();
        mostrarToast('Proveedor eliminado', 'El proveedor fue eliminado correctamente.');
        await cargarProveedores();
      } catch {
        mostrarToast('Error', 'No se pudo eliminar el proveedor.', true);
      } finally {
        btn.disabled = false; spinner.classList.add('d-none');
      }
    }

    /* ══ Toast ══ */
    let toastT;
    function mostrarToast(titulo, msg, error = false) {
      const t = document.getElementById('toast');
      document.getElementById('toastTitulo').textContent = titulo;
      document.getElementById('toastMsg').textContent    = msg;
      t.className = 'toast-drg' + (error ? ' error' : '');
      t.style.display = 'block';
      clearTimeout(toastT);
      toastT = setTimeout(() => t.style.display = 'none', 4000);
    }

    /* ══ Logout ══ */
    function cerrarSesion() { localStorage.clear(); window.location.href = 'index.html'; }

    cargarProveedores();
  </script>
</body>
</html>
