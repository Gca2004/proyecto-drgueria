apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-pagos
  namespace: drgueria
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-pagos
  template:
    metadata:
      labels:
        app: ms-pagos
        monitored: "true"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ms-pagos
          image: gustavocoque/ms-pagos:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3004
          envFrom:
            - configMapRef:
                name: ms-pagos-config
            - secretRef:
                name: ms-pagos-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: ms-pagos-svc
  namespace: drgueria
  labels:
    app: ms-pagos
    monitored: "true"
spec:
  selector:
    app: ms-pagos
  ports:
    - name: http
      port: 3004
      targetPort: 3004
