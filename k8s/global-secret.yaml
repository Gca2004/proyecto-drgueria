# ══════════════════════════════════════════════════════════
# Secret global — credenciales de MySQL y JWT
# Los valores están en base64.
#   echo -n "drgueria2024"  | base64  → ZHJndWVyaWEyMDI0
#   echo -n "drgueria_secreto_2024" | base64 → ZHJndWVyaWFfc2VjcmV0b18yMDI0
#   echo -n "root" | base64 → cm9vdA==
# ══════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: drgueria-global-secret
  namespace: drgueria
type: Opaque
data:
  DB_USER: cm9vdA==
  DB_PASSWORD: ZHJndWVyaWEyMDI0
  JWT_SECRET: ZHJndWVyaWFfc2VjcmV0b18yMDI0
