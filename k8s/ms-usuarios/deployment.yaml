apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-usuarios
  namespace: drgueria
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-usuarios
  template:
    metadata:
      labels:
        app: ms-usuarios
        monitored: "true"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ms-usuarios
          image: gustavocoque/ms-usuarios:latest
          # En Minikube usar: imagePullPolicy: Never
          # (porque las imágenes se construyen localmente)
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ms-usuarios-config
            - secretRef:
                name: ms-usuarios-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: ms-usuarios-svc
  namespace: drgueria
  labels:
    app: ms-usuarios
    monitored: "true"
spec:
  selector:
    app: ms-usuarios
  ports:
    - name: http
      port: 3000
      targetPort: 3000
