# ══════════════════════════════════════════════════════════
# Ingress — punto de entrada único al cluster
# Requiere: minikube addons enable ingress
# ══════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: drgueria-ingress
  namespace: drgueria
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    # API Gateway — todas las peticiones de la API
    - host: drgueria.local
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: api-gateway-svc
                port:
                  number: 4000
          # Frontend — raíz del sitio
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 80
