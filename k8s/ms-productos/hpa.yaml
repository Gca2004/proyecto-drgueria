# ══════════════════════════════════════════════════════════
# HPA — ms-productos
# Escala entre 2 y 5 pods cuando el CPU supera el 70%
# ══════════════════════════════════════════════════════════
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-productos-hpa
  namespace: drgueria
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-productos
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
