apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-auditoria
  namespace: drgueria
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-auditoria
  template:
    metadata:
      labels:
        app: ms-auditoria
        monitored: "true"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ms-auditoria
          image: gustavocoque/ms-auditoria:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3006
          envFrom:
            - configMapRef:
                name: ms-auditoria-config
            - secretRef:
                name: ms-auditoria-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: ms-auditoria-svc
  namespace: drgueria
  labels:
    app: ms-auditoria
    monitored: "true"
spec:
  selector:
    app: ms-auditoria
  ports:
    - name: http
      port: 3006
      targetPort: 3006
