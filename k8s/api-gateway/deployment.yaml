apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: drgueria
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        monitored: "true"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-gateway
          image: gustavocoque/api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: api-gateway-config
            - secretRef:
                name: api-gateway-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "150m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-svc
  namespace: drgueria
  labels:
    app: api-gateway
    monitored: "true"
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 4000
      targetPort: 4000
  # NodePort para acceder desde fuera del cluster en Minikube
  type: NodePort
